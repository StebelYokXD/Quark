/* Анимация перехода между экранами */

animation: screenIn 0.3s ease;

}

body {

.header {

.search-input:focus {

/* Анимация переключателя */
.toggle {
transition: background 0.3s ease;
}
.toggle::after {
transition: left 0.3s ease;
}
 /* Контейнер для экранов */
.main-content {
    position: relative;
    overflow: hidden;
}

/* Базовые стили экранов */
.screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);

}

/* Список чатов — основной экран */
#screenChats {
    transform: translateX(0);
}

/* Чат — спрятан справа */
#screenMessages {
    transform: translateX(100%);
}

    transform: translateX(0);
}

/* Список чатов уезжает влево */

    transform: translateX(-30%);

#screenProfile, #screenSettings {

}
#screenProfile.active, #screenSettings.active {

    opacity: 1;
}

async function sendMsg(){if(!currentUser||!currentChat||selectionMode)return;const inp=$('#msgInput'),txt=inp.value.trim(),f=$('#fileInput')?.files[0];if(!txt&&!f)return;const sb=$('#sendBtn');if(sb)sb.disabled=true;shouldScrollDown=true;try{let iu='',fn='',ft='';if(f){const c=await compressFile(f);iu=c.dataUrl;fn=f.name;ft=c.type;$('#fileInput').value=''}const cid=[currentUser.uid,currentChat].sort().join('_');await db.collection('messages').add({text:txt,imageUrl:iu,fileName:fn,fileType:ft,fileUrl:iu,userId:currentUser.uid,chatId:cid,readBy:[],replyTo:replyTo||null,timestamp:firebase.firestore.FieldValue.serverTimestamp()});if(!activeChats.has(currentChat)){activeChats.add(currentChat);await loadChatPreview(currentChat)}cancelReply();if(inp){inp.value='';inp.style.height='auto';inp.focus()}}catch(e){console.error(e)}finally{const sb=$('#sendBtn');if(sb)sb.disabled=false}}
function compressFile(file){return new Promise(r=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height,mx=600;if(w>h&&w>mx){h*=mx/w;w=mx}else if(h>mx){w*=mx/h;h=mx}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);r({dataUrl:c.toDataURL('image/jpeg',0.6),type:'image/jpeg'})};img.src=rd.result};rd.readAsDataURL(file)})}

// ==================== LISTEN FOR NEW MESSAGES ====================
function listenForMessages() {
    var firstLoad = true;
    
    db.collection('messages').orderBy('timestamp', 'asc').onSnapshot(function(snap) {
        if (firstLoad) {
            firstLoad = false;
            return;
        }
        
        var needsUpdate = false;
        
        snap.docChanges().forEach(function(change) {
            if (change.type === 'added') {
                var m = change.doc.data();
                if (m.userId === currentUser.uid || !m.timestamp) return;
                
                var cid = m.chatId;
                if (!cid || cid === 'general') return;
                
                var parts = cid.split('_');
                var other = parts.find(function(p) { return p !== currentUser.uid; });
                if (!other) return;
                
                if (!activeChats.has(other) && allUsers[other]) {
                    activeChats.add(other);
                    loadChatPreview(other);
                    needsUpdate = true;
                }
                
                var curCid = currentChat ? [currentUser.uid, currentChat].sort().join('_') : '';
                if (cid !== curCid) {
                    unreadCounts[other] = (unreadCounts[other] || 0) + 1;
                    needsUpdate = true;
                    playSound();
                    
                    // Push-уведомление
                    var receiver = allUsers[other];
                    if (receiver && receiver.fcmToken) {
                        fetch('https://fcm.googleapis.com/v1/projects/massanger-2413e/messages:send', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + currentUser.accessToken
                            },
                            body: JSON.stringify({
                                message: {
                                    token: receiver.fcmToken,
                                    notification: {
                                        title: (allUsers[m.userId] || {}).displayName || 'Quark',
                                        body: m.text || '📷 Фото'
                                    }
                                }
                            })
                        }).catch(function(e) {});
                    }
                }
            }
        });
        
        if (needsUpdate) renderChatList();
    });
}

// ==================== REPLY ====================
function setReply(msgId,text,sender){replyTo=msgId;$('#replyBar').classList.remove('hidden');$('#replyPreview').textContent=sender+': '+(text||'Фото').substring(0,50);$('#msgInput').focus()}
function cancelReply(){replyTo=null;$('#replyBar').classList.add('hidden')}

// ==================== PROFILE ====================
function viewUserProfile(uid){if(uid===currentUser.uid){showScreen('screenProfile');return}const u=allUsers[uid];if(!u)return;const um=$('#userModal');if(!um)return;um.classList.remove('hidden');$('#umAv').innerHTML=u.avatarUrl?`<img src="${u.avatarUrl}" style="width:100%;height:100%;object-fit:cover;">`:(u.displayName||'П')[0].toUpperCase();$('#umName').textContent=u.displayName||'Пользователь';$('#umUser').textContent=u.username?'@'+u.username:'';$('#umBio').textContent=u.bio||'';$('#umMsgBtn').onclick=()=>{if(!activeChats.has(uid)){activeChats.add(uid);loadChatPreview(uid)}openChat(uid);um.classList.add('hidden')};$('#umCloseBtn').onclick=()=>um.classList.add('hidden')}

// ==================== ATTACH ====================
function toggleAttach(){const menu=$('#attachMenu'),btn=$('#attachBtn');if(!menu||!btn)return;const r=btn.getBoundingClientRect();menu.style.position='fixed';menu.style.bottom=(window.innerHeight-r.top+10)+'px';menu.style.left=(r.left-10)+'px';menu.classList.toggle('show')}

// ==================== SCREENS ====================
function showScreen(id){var screens=$$('.screen');var currentActive=null;screens.forEach(function(s){if(s.classList.contains('active'))currentActive=s;s.classList.remove('active')});var newScreen=$('#'+id);if(!newScreen)return;newScreen.style.opacity='0';newScreen.style.transform='translateY(8px)';newScreen.style.transition='opacity 0.2s ease, transform 0.2s ease';newScreen.classList.add('active');setTimeout(function(){newScreen.style.opacity='1';newScreen.style.transform='translateY(0)'},10);var isMsg=id==='screenMessages';var bn=$('#bottomNav');if(bn){if(isMsg)bn.classList.add('hidden');else bn.classList.remove('hidden')}if(!isMsg){var list=['screenChats','screenProfile','screenSettings'];$$('.nav-item').forEach(function(n,i){n.classList.toggle('active',i===list.indexOf(id))})}if(id==='screenProfile')updateProfileUI()}

// ==================== LISTENERS ====================
function setupListeners(){$$('.nav-item').forEach(n=>n.onclick=()=>showScreen(n.dataset.sc));$('#backBtn').onclick=()=>showScreen('screenChats');$('#sendBtn').onclick=sendMsg;const inp=$('#msgInput');if(inp){inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>768){e.preventDefault();sendMsg()}};inp.oninput=function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';setTyping()}}$('#attachBtn').onclick=function(e){e.stopPropagation();e.preventDefault();toggleAttach()};$$('.attach-menu-item').forEach(item=>{item.onclick=function(e){e.stopPropagation();const fi=$('#fileInput');if(fi){fi.accept=this.dataset.accept;fi.click()}$('#attachMenu').classList.remove('show')}});$('#fileInput').onchange=()=>{if($('#fileInput').files[0])sendMsg()};$('#replyClose').onclick=cancelReply;$('#saveProfBtn').onclick=async()=>{const dn=$('#dnInput')?.value.trim(),un=$('#unInput')?.value.trim();if(!dn)return alert('Введите имя');if(un&&un!==(currentProfile.username||'')){const s=await db.collection('users').where('username','==',un).get();if(s.docs.some(d=>d.id!==currentUser.uid))return alert('Username занят')}const data={displayName:dn,username:un,bio:$('#bioInput')?.value.trim()||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()};await db.collection('users').doc(currentUser.uid).update(data);currentProfile={...currentProfile,...data};updateProfileUI();await loadAllUsers();renderChatList();alert('✅ Сохранено')};const ai=document.createElement('input');ai.type='file';ai.accept='image/*';ai.className='hidden';document.body.appendChild(ai);$('#avEditBtn').onclick=()=>ai.click();ai.onchange=async()=>{const f=ai.files[0];if(!f)return;const b64=await compressFile(f);const img=new Image();img.src=b64.dataUrl;await new Promise(r=>img.onload=r);const c=document.createElement('canvas');c.width=c.height=200;c.getContext('2d').drawImage(img,0,0,200,200);const av=c.toDataURL('image/jpeg',0.5);currentProfile.avatarUrl=av;await db.collection('users').doc(currentUser.uid).update({avatarUrl:av,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});updateProfileUI();await loadAllUsers();renderChatList()};$('#logoutBtn').onclick=logout;$('#settLogout').onclick=logout;$('#darkRow').onclick=()=>{darkMode=!darkMode;localStorage.setItem('quark_dark',darkMode?'1':'0');applyTheme()};$('#darkToggle').onclick=e=>{e.stopPropagation();darkMode=!darkMode;localStorage.setItem('quark_dark',darkMode?'1':'0');applyTheme()};$('#fontRow').onclick=()=>{const s=['small','medium','large'];fontSize=s[(s.indexOf(fontSize)+1)%3];applyFontSize();const fv=$('#fontValue');if(fv)fv.textContent={small:'Мелкий',medium:'Средний',large:'Крупный'}[fontSize]};$('#soundRow').onclick=()=>{const st=$('#soundToggle');if(st)st.classList.toggle('active');const isActive=st.classList.contains('active')};$('#soundToggle').onclick=e=>{e.stopPropagation();const st=$('#soundToggle');st.classList.toggle('active')};const si=$('#searchInput');if(si)si.oninput=function(){const q=this.value.toLowerCase();if(q){const list=$('#chatList');if(!list)return;list.innerHTML='';Object.values(allUsers).forEach(u=>{if(u.id===currentUser.uid)return;const name=(u.displayName||'').toLowerCase(),uname=(u.username||'').toLowerCase();if(name.includes(q)||uname.includes(q)){const d=document.createElement('div');d.className='chat-item';d.innerHTML=`<div class="avatar">${u.avatarUrl?`<img src="${u.avatarUrl}">`:(u.displayName||'П')[0].toUpperCase()}</div><div class="chat-info"><div class="chat-name">${u.displayName||'Пользователь'}</div>${u.username?`<div style="font-size:12px;color:var(--primary);">@${u.username}</div>`:''}</div>`;d.onclick=()=>{if(!activeChats.has(u.id)){activeChats.add(u.id);loadChatPreview(u.id)}openChat(u.id)};list.appendChild(d)}})}else{renderChatList()}};const ma=$('#msgArea');if(ma)ma.onscroll=()=>{if(ma)shouldScrollDown=ma.scrollHeight-ma.scrollTop-ma.clientHeight<80};$('#msgMenuBtn').onclick=toggleSelect;$('#cancelSelectBtn').onclick=()=>toggleSelect();$('#deleteSelectedBtn').onclick=deleteSelected;document.addEventListener('click',function(e){const menu=$('#attachMenu'),btn=$('#attachBtn');if(menu&&!menu.contains(e.target)&&e.target!==btn&&!btn?.contains(e.target))menu.classList.remove('show');if(e.target===$('#userModal'))$('#userModal')?.classList.add('hidden')})}

// ==================== START ====================
auth.onAuthStateChanged(async(user)=>{if(user){currentUser=user;await loadProfile();buildMainUI();await initChats()}else{showAuthScreen()}});
// PUSH NOTIFICATIONS
const messaging = firebase.messaging();

async function initPushNotifications() {
    try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
            const token = await messaging.getToken({
                vapidKey: 'BI-4PaT9XQVG0CXAoNatPPWTdw_jNUVpSajOixlM9bmEQugbMB6-lIDBypIU_kXbUpBGTrE6Zs91P88R51FXoSU'
            });
            if (token) {
                await db.collection('users').doc(currentUser.uid).update({ fcmToken: token });
            }
        }
    } catch (e) {
        console.log('Push not available:', e);
    }
}

// Вызови в initChats или после входа
setTimeout(initPushNotifications, 2000);

function initPush() {
    if ('Notification' in window) {
        Notification.requestPermission().then(function(permission) {
            if (permission === 'granted') {
                navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function(registration) {
                    const messaging = firebase.messaging();
                    messaging.getToken({
                        vapidKey: 'BI-4PaT9XQVG0CXAoNatPPWTdw_jNUVpSajOixlM9bmEQugbMB6-lIDBypIU_kXbUpBGTrE6Zs91P88R51FXoSU',
                        serviceWorkerRegistration: registration
                    }).then(function(token) {
                        if (token) {
                            db.collection('users').doc(currentUser.uid).update({ fcmToken: token });
                        }
                    }).catch(function(e) {});
                });
            }
        });
    }
}
